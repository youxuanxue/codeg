name: Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUST_BACKTRACE: short
  # Refuse to silently regenerate snapshots in CI — any drift must be
  # accepted locally with `cargo insta review` and committed.
  INSTA_UPDATE: "no"
  # Debuginfo as line tables only (`test` inherits `dev`): backtraces keep
  # their file:line, and the type and variable records no CI step reads are
  # not built, which shrinks codeg_lib's debug rlib and every test binary
  # that links it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + vitest + build)
    # Frontend tests are OS-independent (jsdom + pure TS), keep on Linux
    # to save CI minutes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint .

      - name: Browser agent bundle matches its source
        # `src-tauri/src/browser/js/agent.bundle.js` is committed so that a
        # cargo build needs no node — `include_str!` reads it at compile time.
        # A committed artifact is only worth anything if it is the one the
        # source produces, and nothing else in the build would notice a stale
        # one: the Rust side would happily embed last week's bundle.
        run: pnpm browser:agent:check

      - name: Browser agent typecheck
        # `browser-agent/` is excluded from the app's tsconfig (its vendored
        # half answers to Playwright's compiler settings, not ours), so the
        # repo-wide typecheck in `pnpm build` never sees our entry point.
        run: pnpm browser:agent:types

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Static export build
        run: pnpm build

  rust:
    # Linux only. macOS and Windows runners took 15 to 85 minutes per cell,
    # almost all of it linking `codeg_lib` into test binaries (the macOS
    # desktop cell: 44 minutes linking, under 2 minutes of tests), against
    # 5 to 12 minutes on Linux. Release builds (`release.yml`) still cover
    # all three platforms, so a platform-only break surfaces there.
    name: Rust ${{ matrix.mode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        mode: [desktop, server, cli]
        include:
          - mode: desktop
            # `test-utils` exposes test scaffolding (AppState::new_for_test,
            # EventEmitter::test_web_only, ConnectionManager::insert_test_connection,
            # parser `with_base_dir`, `db::test_helpers`) for integration tests
            # under `tests/`. Without the flag those items are physically
            # uncompiled, so integration tests would fail to link.
            cargo_args: "--features test-utils"
            # Desktop clippy must lint integration tests too, so it picks up
            # `--all-targets`. test-utils is already on, so tests compile.
            clippy_args: "--all-targets --features test-utils"
          - mode: server
            # Server build is feature-gated off the Tauri runtime; no
            # need for webkit/appindicator system libs. `--lib` skips
            # integration tests for `cargo test`, so `test-utils` is not
            # required here.
            cargo_args: "--no-default-features --features server-bin --bin codeg-server --lib"
            # Server clippy intentionally skips `--all-targets`: integration
            # tests are already linted in the desktop cells, and pulling
            # them in here would force `test-utils` (a test-only feature)
            # into the server build matrix. Lint scope here is lib + the
            # codeg-server binary, which is exactly the cfg-gated surface
            # that this cell exists to verify.
            clippy_args: "--no-default-features --features server-bin --bin codeg-server --lib"
          - mode: cli
            # The `codeg-cli` client (`src/cli/`), which only `cli-bin`
            # compiles: the server cell leaves it out. The runtime side
            # (`cli_run`) is in the lib, which the server cell tests already.
            cargo_args: "--no-default-features --features cli-bin --lib cli::"
            clippy_args: "--no-default-features --features cli-bin --bin codeg-cli --lib"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned, not `@stable`: a new stable ships new clippy lints, and every
        # branch's CI turns red on the day it lands, over code nobody touched
        # (1.100.0 did exactly that to `experts.rs`, 2026-11-13). To upgrade,
        # change this version in a PR of its own, so its lints are fixed
        # where they are seen. `release.yml` builds the shipped binaries and
        # still floats; keep it in step if the two should ever differ less.
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-${{ matrix.os }}-${{ matrix.mode }}

      - name: Install Linux desktop dependencies
        # Only the desktop build needs webkit/appindicator.
        if: matrix.mode == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Tauri frontendDist placeholder
        # Tauri's build script validates `frontendDist` and bundled resource
        # paths during Rust compilation. The frontend job owns the real static
        # export; Rust desktop cells only need the path to exist for tests.
        if: matrix.mode == 'desktop'
        shell: bash
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html

      - name: cargo test
        working-directory: src-tauri
        run: cargo test ${{ matrix.cargo_args }}

      - name: cargo clippy
        # Clippy on the server and cli cells — server covers cfg-gated
        # server-only code. Treat warnings as errors now that the 8
        # pre-existing advisories are cleared. The desktop cell is linted by
        # `rust-desktop-clippy` below, in parallel: it is the longest cell,
        # and its lint (tauri-only code plus the integration tests) shares no
        # build output with its tests.
        if: matrix.mode != 'desktop'
        working-directory: src-tauri
        run: cargo clippy ${{ matrix.clippy_args }} -- -D warnings

      - name: Web handlers must route through commands/*_core
        # Lock in the dedup from Phase 8: web/handlers/{folders,conversations}.rs
        # must not call DB services directly. They have to delegate to a
        # `_core` function in `commands/*.rs` so the Tauri command and HTTP
        # entrypoints share one implementation. A pure text check, so one
        # cell is enough.
        if: matrix.mode == 'desktop'
        working-directory: src-tauri
        run: |
          if grep -nE 'folder_service::|conversation_service::|tab_service::|import_service::' \
             src/web/handlers/folders.rs \
             src/web/handlers/conversations.rs; then
            echo "::error::Web handlers must call commands/*_core, not services directly."
            exit 1
          fi

      - name: Superpowers standalone skill helper layouts
        # executing-plans ships local copies of its sibling helpers so the
        # skill works when Codeg has to copy only one skill on Windows.
        if: matrix.mode == 'desktop'
        run: bash scripts/test-superpowers-skill-layouts.sh

  rust-desktop-clippy:
    # The desktop lint, split from the desktop tests so the two run side by
    # side (the cell's tests are the longest job in the run). Same scope as
    # before: `--all-targets` with `test-utils`, so tauri-only code and the
    # integration tests are linted. `check`-profile output cannot be reused by
    # the test build, so this job keeps a cache of its own.
    name: Rust desktop clippy on ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Same pin as the `rust` job above; change both together.
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: clippy-ubuntu-22.04-desktop

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Tauri frontendDist placeholder
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features test-utils -- -D warnings

  local-deploy:
    name: local deploy script
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Path rewrite and launchd plist rendering
        run: |
          sudo apt-get install -y sqlite3 libxml2-utils
          bash scripts/local-deploy_test.sh
