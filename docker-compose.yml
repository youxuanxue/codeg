services:
  codeg:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Or use a pre-built image:
    # image: xintaofei/codeg:latest
    ports:
      - "3080:3080"
      # Port bridge for dev servers started by agents inside the container:
      # the workbench shows `http://localhost:3000` from the container through
      # one of these ports (one per dev server). Publish the same range you set
      # in CODEG_BRIDGE_PORTS (default: the ten ports after CODEG_PORT).
      # Drop this line if you set CODEG_BRIDGE_HOST_PATTERN below.
      - "3081-3090:3081-3090"
    volumes:
      - codeg-data:/data
      - codeg-npm-global:/root/.codeg/npm-global
      # Set CODEG_PROJECTS_DIR to the host directory shown in the folder picker.
      # The default keeps a local ./projects directory beside this file.
      - ${CODEG_PROJECTS_DIR:-./projects}:/projects
      # Reuse the official CLI configuration stores from the host. This keeps
      # Codeg independent of cc-switch: each CLI reads and updates its own
      # native files.
      # Set CODEG_AGENT_HOME when the host user home is not the default $HOME.
      - ${CODEG_AGENT_HOME:-$HOME}/.claude:/root/.claude
      - ${CODEG_AGENT_HOME:-$HOME}/.codex:/root/.codex
      - ${CODEG_AGENT_HOME:-$HOME}/.gemini:/root/.gemini
      - ${CODEG_AGENT_HOME:-$HOME}/.pi:/root/.pi
      - ${CODEG_AGENT_HOME:-$HOME}/.kimi-code:/root/.kimi-code
    environment:
      - CODEG_TOKEN=${CODEG_TOKEN:-}
      - CODEG_PORT=3080
      - CODEG_HOST=0.0.0.0
      - NPM_CONFIG_PREFIX=/root/.codeg/npm-global
      - PATH=/root/.codeg/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - CODEG_HOST_PROXY_ENABLED=${CODEG_HOST_PROXY_ENABLED:-1}
      - CODEG_HOST_PROXY_HOST=${CODEG_HOST_PROXY_HOST:-host.docker.internal}
      - CODEG_HOST_PROXY_PORT=${CODEG_HOST_PROXY_PORT:-7890}
      # The host's CLI config may contain loopback proxy settings. They point
      # at the container unless explicitly replaced for this deployment.
      - HTTP_PROXY=${CODEG_HTTP_PROXY:-}
      - HTTPS_PROXY=${CODEG_HTTPS_PROXY:-}
      # - CODEG_BRIDGE_PORTS=3081-3090   # or `off` to disable the port bridge
      # Name the dev servers by hostname instead of giving each one a port:
      # `3000.codeg.example.com` reaches the container's port 3000 over the
      # published 3080, so nothing above has to be published and no range has
      # to be guessed. Needs a wildcard DNS record for the name and, behind a
      # reverse proxy, a wildcard vhost pointing at this service and passing
      # `Host` through (Caddy: `*.codeg.example.com { reverse_proxy codeg:3080 }`).
      # `auto` puts the port one label in front of whatever host the workbench
      # itself was opened at.
      # - CODEG_BRIDGE_HOST_PATTERN=auto
    # In-place upgrades (Settings → Software Update) rewrite the binaries and
    # web assets inside this container's writable layer, not the image. The
    # codeg-data volume persists, but an upgrade lives only in the running
    # container: recreating it (`--force-recreate`, or recreating after a
    # `docker pull`) starts from the image again and drops the upgrade. Build or
    # pull an image at the new version and recreate to make it permanent.
    restart: unless-stopped

volumes:
  codeg-data:
  codeg-npm-global:
